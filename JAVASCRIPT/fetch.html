<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop</title>
    <style>
        table {
            width: 80%;
            margin:auto;
            padding: 10px;
            font-size:25px;
            color:rgba(56, 25, 25, 0.611);
            border: 2px solid black;
        }
        
    tr {
        height: 80px;
    }

    tbody tr:nth-child(3n + 1) {
        background-color: rgb(192, 219, 228);
    }

    tbody tr:nth-child(3n + 2) {
        background-color: rgb(196, 246, 196);
    }

   tbody tr:nth-child(3n + 3) {
        background-color: rgb(239, 198, 204);
    }

    td, th {
        padding: 10px;
    }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Serial No</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="data">
        </tbody>
    </table>
    <script>
        const ele = document.getElementById("data");
        const url="https://dummyjson.com/product";
        async function load_Product(){
            try{
                const res = await fetch(url);  // The data is fetched in string format
                const data = await res.json(); // So we convert this string to json format
                console.log("DATA",data.products);
                let row="";
                // Literals are bringing data from json thatswhy we use til ` and ${}
                // In image we give 0 because our machine does not know that image is in array format

                data.products.map((i,index)=>{
                    row+=`
                    
                    <tr>
                        <td align="center">${index+=1}</td>
                        <td align="center">${i.title}</td>
                        <td><img src="${i.images[0]}" width="90"></td>
                        <td>${i.category}</td>
                        <td>${i.price}</td>
                    </tr>
                
                    `;
                    ele.innerHTML=row;
                
                })

            }

            catch(err){
                console.log("Error",err);

            }
        }

        load_Product();

    </script>
</body>
</html>
